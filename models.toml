# Crew model registry.
#
# Identity = provider + endpoint + model_id + credential_profile.
# Billing is explicit; capabilities are verified properties, never inferred
# from a model name. Prices are Decimal strings per 1M tokens (USD) and are
# only billable for billing = "payg". Subscription/free_quota consume quota,
# they are not zero-cost PAYG calls.

[profiles.local]
provider = "local"
endpoint = "local"
api_key_env = ""
billing = "local"

[profiles.gemini-plus]
provider = "google"
endpoint = "gemini"
api_key_env = "GEMINI_API_KEY"
billing = "subscription"

[profiles.opencode-go]
provider = "opencode"
endpoint = "go"
api_key_env = "OPENCODE_API_KEY"
billing = "subscription"

[profiles.opencode-free]
provider = "opencode"
endpoint = "zen-free"
api_key_env = "OPENCODE_API_KEY"
billing = "free_quota"

[profiles.openrouter]
provider = "openrouter"
endpoint = "api"
api_key_env = "OPENROUTER_API_KEY"
billing = "unknown"

[profiles.deepseek-api]
provider = "deepseek"
endpoint = "direct-api"
api_key_env = "DEEPSEEK_API_KEY"
billing = "payg"

[[models]]
profile = "local"
model_id = "qwen3.6-35b-a3b"
family = "local"
capabilities = ["text", "json"]
billing = "local"
quota_consumed = false
currency = "USD"
input_per_million = "0"
output_per_million = "0"
pricing_source = "local inference (no remote billing)"
pricing_updated = "2026-10-30"

