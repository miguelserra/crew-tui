name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Byte-compile
        run: python -m py_compile main.py budget.py factory.py power.py power_linux.py power_win.py peak.py registry.py state.py store.py attempts.py engine.py router.py verify.py profiles.py scaffold.py workspace.py publish.py requirements.py architecture.py executor.py context_reader.py
      - name: Power policy tests
        run: python tests/test_power.py
      - name: Budget breaker tests
        run: python tests/test_budget.py
      - name: P0/P1 core tests
        run: python -m unittest discover -s tests -p "test_p01_*.py"
      - name: P2 core tests
        run: python -m unittest discover -s tests -p "test_p02_*.py"
      - name: P3 core tests
        run: python -m unittest discover -s tests -p "test_p03_*.py"
      - name: P4 core tests
        run: python -m unittest discover -s tests -p "test_p04_*.py"
      - name: P5 core tests
        run: python -m unittest discover -s tests -p "test_p05_*.py"
      - name: P6 core tests
        run: python -m unittest discover -s tests -p "test_p06_*.py"
      - name: P6.1 publish safety tests
        run: python -m unittest discover -s tests -p "test_p061_*.py"
      - name: P7 baseline/native tests
        run: python -m unittest discover -s tests -p "test_p7_*.py"

  integration:
    name: Integration (py3.13)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install runtime (no keys, no Playwright)
        run: python -m pip install -r requirements.txt
      - name: P1/P2 dependency-backed tests
        run: python -m unittest discover -s tests -p "test_p0*_integration.py"
      - name: P7 native executor
        run: python -m unittest discover -s tests -p "test_p7_executor.py"

  windows:
    name: Windows (py3.13)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Byte-compile
        run: python -m py_compile main.py budget.py factory.py power.py power_linux.py power_win.py peak.py registry.py state.py store.py attempts.py engine.py router.py verify.py profiles.py scaffold.py workspace.py publish.py requirements.py architecture.py executor.py context_reader.py
      - name: Windows backend tests
        run: python tests/test_power_win.py
      - name: Budget breaker tests
        run: python tests/test_budget.py
      - name: P0/P1 core tests
        run: python -m unittest discover -s tests -p "test_p01_*.py"
      - name: P2 core tests
        run: python -m unittest discover -s tests -p "test_p02_*.py"
      - name: P3 core tests
        run: python -m unittest discover -s tests -p "test_p03_*.py"
      - name: P4 core tests
        run: python -m unittest discover -s tests -p "test_p04_*.py"
      - name: P5 core tests
        run: python -m unittest discover -s tests -p "test_p05_*.py"
      - name: P6 core tests
        run: python -m unittest discover -s tests -p "test_p06_*.py"
      - name: P6.1 publish safety tests
        run: python -m unittest discover -s tests -p "test_p061_*.py"
      - name: P7 baseline/native tests
        run: python -m unittest discover -s tests -p "test_p7_*.py"
